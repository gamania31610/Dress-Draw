<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>隨機抽籤系統</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --folder-color: #38bdf8;
      --file-color: #818cf8;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --bg: #0f172a;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      /* 強制鎖死剛好一個視窗高度，絕對不超過一頁、不出捲軸 */
      height: 100vh;
      height: 100dvh; /* 適配手機瀏覽器動態網址列 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* 完美垂直置中 */
      padding: 8px 16px;
      overflow: hidden; 
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 1.15rem;
      margin-bottom: 4px;
    }

    .status-bar {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .status-bar span strong {
      color: var(--text);
    }

    .image-box {
      width: 100%;
      height: 210px; /* 手機上精準的高度，確保垂直置中時上下空間完美平衡 */
      background-color: #1e293b;
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      margin-bottom: 8px;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0 12px;
    }

    .result-label {
      min-height: 38px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.3;
      word-break: break-all;
    }

    .result-folder {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--folder-color);
      margin-top: 1px;
      display: inline-block;
    }

    .result-filename {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--file-color);
      display: inline-block;
    }

    .controls {
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #drawBtn {
      background-color: var(--primary);
      color: white;
      flex: 2;
    }

    #drawBtn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    #resetBtn {
      background-color: #1e293b;
      color: var(--danger);
      border: 1px solid var(--border);
      flex: 1;
      line-height: 1.1;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    #resetBtn:hover:not(:disabled) {
      background-color: var(--danger);
      color: white;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.75rem;
      margin-top: 4px;
      display: none;
    }

    /* ========================================== */
    /* PC 電腦螢幕大畫面自動展開 */
    /* ========================================== */
    @media (min-width: 768px) {
      .wrapper {
        max-width: 640px;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 12px;
      }
      .status-bar {
        font-size: 1.05rem;
        margin-bottom: 16px;
      }
      .image-box {
        height: 400px;
        margin-bottom: 16px;
      }
      .placeholder-text {
        font-size: 1.1rem;
      }
      .result-label {
        font-size: 1rem;
        min-height: 56px;
        margin-bottom: 16px;
      }
      .result-folder {
        font-size: 1.2rem;
      }
      .result-filename {
        font-size: 1.45rem;
      }
      button {
        padding: 14px 24px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>隨機抽籤</h1>
    <div class="status-bar">
      <span>總數：<strong id="totalCount">-</strong></span>
      <span>已抽：<strong id="drawnCount">-</strong></span>
      <span>剩餘：<strong id="remainCount">-</strong></span>
    </div>

    <div class="image-box">
      <div class="placeholder-text" id="placeholder">正在從 GitHub 載入圖片清單...</div>
      <img id="resultImg" alt="抽籤結果">
    </div>

    <div class="result-label" id="resultLabel"></div>

    <div class="controls">
      <button id="drawBtn" disabled>抽籤</button>
      <button id="resetBtn" disabled>RESET<br>重置</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const CONFIG = {
      owner: 'gamania31610',
      repo: 'Dress-Draw',
      targetFolder: 'images/', 
      storageKey: 'dress_draw_history_v1',
      allowedExtensions: ['.jpg', '.jpeg', '.png', '.gif', '.webp']
    };

    let allImages = [];      
    let drawnHistory = [];   
    let isDrawing = false;

    const totalCountEl = document.getElementById('totalCount');
    const drawnCountEl = document.getElementById('drawnCount');
    const remainCountEl = document.getElementById('remainCount');
    const placeholderEl = document.getElementById('placeholder');
    const resultImgEl = document.getElementById('resultImg');
    const resultLabelEl = document.getElementById('resultLabel');
    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const errorMsgEl = document.getElementById('errorMsg');

    async function init() {
      loadHistory();
      try {
        await fetchRepoImages();
        updateUIState();
        if (allImages.length === 0) {
          placeholderEl.textContent = `在 ${CONFIG.targetFolder} 找不到圖片`;
        } else if (getAvailableImages().length === 0) {
          placeholderEl.textContent = '所有圖片都抽完了！請點擊 Reset。';
        } else {
          placeholderEl.textContent = '準備就緒，點擊下方按鈕抽籤';
        }
      } catch (err) {
        showError(`載入失敗：${err.message}`);
        placeholderEl.textContent = '無法載入圖片清單';
      }
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(CONFIG.storageKey);
        drawnHistory = saved ? JSON.parse(saved) : [];
      } catch (e) {
        drawnHistory = [];
      }
    }

    function saveHistory() {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(drawnHistory));
    }

    async function fetchRepoImages() {
      const repoRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`);
      if (!repoRes.ok) {
        if (repoRes.status === 403) throw new Error('API 請求次數達上限');
        if (repoRes.status === 404) throw new Error('找不到 Repo，請確認是否為 Public');
        throw new Error(`HTTP ${repoRes.status}`);
      }
      const repoData = await repoRes.json();
      const defaultBranch = repoData.default_branch;

      const treeRes = await fetch(
        `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${defaultBranch}?recursive=1`
      );
      if (!treeRes.ok) throw new Error(`無法讀取目錄 (HTTP ${treeRes.status})`);
      const treeData = await treeRes.json();

      allImages = treeData.tree
        .filter(item => {
          if (item.type !== 'blob') return false;
          if (!item.path.startsWith(CONFIG.targetFolder)) return false;
          const lowerPath = item.path.toLowerCase();
          return CONFIG.allowedExtensions.some(ext => lowerPath.endsWith(ext));
        })
        .map(item => item.path);

      const validSet = new Set(allImages);
      drawnHistory = drawnHistory.filter(path => validSet.has(path));
      saveHistory();
    }

    function getAvailableImages() {
      const drawnSet = new Set(drawnHistory);
      return allImages.filter(path => !drawnSet.has(path));
    }

    function updateUIState() {
      const available = getAvailableImages();
      totalCountEl.textContent = allImages.length;
      drawnCountEl.textContent = drawnHistory.length;
      remainCountEl.textContent = available.length;

      drawBtn.disabled = available.length === 0 || isDrawing;
      resetBtn.disabled = drawnHistory.length === 0 || isDrawing;
    }

    function handleDraw() {
      const available = getAvailableImages();
      if (available.length === 0 || isDrawing) return;

      isDrawing = true;
      updateUIState();
      errorMsgEl.style.display = 'none';

      const randomIndex = Math.floor(Math.random() * available.length);
      const selectedPath = available[randomIndex];

      const encodedPath = selectedPath.split('/').map(encodeURIComponent).join('/');
      const imageUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/HEAD/${encodedPath}`;

      const imgLoader = new Image();
      imgLoader.onload = () => {
        drawnHistory.push(selectedPath);
        saveHistory();

        placeholderEl.style.display = 'none';
        resultImgEl.style.display = 'none';
        void resultImgEl.offsetWidth; 
        resultImgEl.src = imageUrl;
        resultImgEl.style.display = 'block';

        const relativePath = selectedPath.replace(CONFIG.targetFolder, '');
        const lastSlashIndex = relativePath.lastIndexOf('/');
        
        let folderName = '';
        let fileName = relativePath;
        if (lastSlashIndex !== -1) {
          folderName = relativePath.substring(0, lastSlashIndex);
          fileName = relativePath.substring(lastSlashIndex + 1);
        }

        let htmlContent = `抽出結果：<br>`;
        if (folderName) {
          htmlContent += `資料夾：<span class="result-folder">${folderName}</span><br>`;
        }
        htmlContent += `檔名：<span class="result-filename">${fileName}</span>`;

        resultLabelEl.innerHTML = htmlContent;

        isDrawing = false;
        updateUIState();

        if (getAvailableImages().length === 0) {
          resultLabelEl.innerHTML += '<br><span style="color: var(--danger); font-size: 0.8rem;">（已全部抽完！）</span>';
        }
      };

      imgLoader.onerror = () => {
        showError(`圖片載入失敗，請重試`);
        isDrawing = false;
        updateUIState();
      };

      imgLoader.src = imageUrl;
    }

    function handleReset() {
      if (!confirm('確定要清除紀錄重新開始嗎？')) return;

      drawnHistory = [];
      saveHistory();

      resultImgEl.style.display = 'none';
      resultImgEl.src = '';
      resultLabelEl.innerHTML = '';
      placeholderEl.style.display = 'block';
      placeholderEl.textContent = '紀錄已重置，點擊下方按鈕抽籤';
      errorMsgEl.style.display = 'none';

      updateUIState();
    }

    function showError(msg) {
      errorMsgEl.textContent = msg;
      errorMsgEl.style.display = 'block';
    }

    drawBtn.addEventListener('click', handleDraw);
    resetBtn.addEventListener('click', handleReset);

    init();
  </script>
</body>
</html>
