<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隨機抽籤系統</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --folder-color: #38bdf8; /* 深色模式下的亮藍色資料夾名 */
      --file-color: #818cf8;   /* 深色模式下的柔和紫色檔名 */
      --danger: #f87171;
      --danger-hover: #ef4444;
      --bg: #0f172a;           /* 深色背景 (Slate 900) */
      --card: #1e293b;         /* 深色卡片背景 (Slate 800) */
      --text: #f1f5f9;         /* 亮色文字 */
      --muted: #94a3b8;        /* 次要文字 */
      --border: #334155;       /* 邊框顏色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px; /* 減少上下左右邊距 */
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      padding: 20px; /* 縮減內部留白，避免手機超出一頁 */
      text-align: center;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.35rem;
      margin-bottom: 4px; /* 減少標題下方空白 */
    }

    .status-bar {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px; /* 減少狀態列下方空白 */
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .status-bar span strong {
      color: var(--text);
    }

    .image-box {
      width: 100%;
      height: 320px; /* 適度調整圖片框高度，適配手機螢幕 */
      background-color: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 0 20px;
    }

    .result-label {
      min-height: 52px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.4;
      word-break: break-all;
    }

    .result-folder {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--folder-color);
      margin-top: 2px;
      display: inline-block;
    }

    .result-filename {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--file-color);
      display: inline-block;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #drawBtn {
      background-color: var(--primary);
      color: white;
      flex: 2;
    }

    #drawBtn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    #resetBtn {
      background-color: #334155;
      color: var(--danger);
      flex: 1;
      line-height: 1.2; /* 讓換行文字間距適中 */
    }

    #resetBtn:hover:not(:disabled) {
      background-color: var(--danger);
      color: white;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>隨機抽籤</h1>
    <div class="status-bar">
      <span>總數：<strong id="totalCount">-</strong></span>
      <span>已抽：<strong id="drawnCount">-</strong></span>
      <span>剩餘：<strong id="remainCount">-</strong></span>
    </div>

    <div class="image-box">
      <div class="placeholder-text" id="placeholder">正在從 GitHub 載入圖片清單...</div>
      <img id="resultImg" alt="抽籤結果">
    </div>

    <div class="result-label" id="resultLabel"></div>

    <div class="controls">
      <button id="drawBtn" disabled>抽籤</button>
      <!-- RESET鈕「重置」前面加了換行 -->
      <button id="resetBtn" disabled>RESET<br>重置</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>
