<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>衣服抽選系統</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='dressGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3ClinearGradient id='goldGrad' x1='0%25' y1='0%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cg transform='translate(0, 4)'%3E%3Cpath d='M 32 10 C 32 8, 30 7, 29 8 C 28 9, 28 10, 30 11 L 20 18 C 17 20, 18 22, 21 21 L 32 16 L 43 21 C 46 22, 47 20, 44 18 L 34 11 C 36 10, 36 8, 35 8 C 34 7, 32 8, 32 10 Z' fill='%2338bdf8' opacity='0.8'/%3E%3Cpath d='M 23 23 Q 32 26 41 23 L 45 46 Q 48 52 52 54 L 12 54 Q 16 52 19 46 Z' fill='url(%23dressGrad)'/%3E%3Cpath d='M 23.5 24.5 Q 32 27.5 40.5 24.5' fill='none' stroke='url(%23goldGrad)' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M 32 26 L 27 54 M 32 26 L 37 54' fill='none' stroke='%230f172a' stroke-width='0.8' opacity='0.3'/%3E%3C/g%3E%3Cg fill='%2338bdf8'%3E%3Cpath d='M 12 14 L 13.5 17.5 L 17 19 L 13.5 20.5 L 12 24 L 10.5 20.5 L 7 19 L 10.5 17.5 Z' transform='scale(0.6) translate(4, 2)' opacity='0.9'/%3E%3Cpath d='M 52 38 L 53 40 L 55 41 L 53 42 L 52 44 L 51 42 L 49 41 L 51 40 Z' fill='%23818cf8'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --folder-color: #38bdf8;
      --file-color: #818cf8;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* 防止手機長按選取文字或跳出系統選單 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 10px 16px;
      overflow: hidden; 
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      justify-items: center;
    }

    /* 區塊 1：標題與狀態列 */
    .section-top {
      width: 100%;
      align-self: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 30px;
      color: #ffffff;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .status-badge {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-badge strong {
      color: var(--text);
      font-weight: 600;
      margin-left: 2px;
    }

    /* 區塊 2：圖片與結果顯示區 */
    .section-middle {
      width: 100%;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .image-box {
      width: 100%;
      height: 190px;
      background-color: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      margin-bottom: 6px;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0 12px;
    }

    .result-label {
      min-height: 54px; 
      max-height: 54px;
      overflow: hidden;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.3;
      word-break: break-all;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .result-folder {
      font-size: 1.15rem;
      font-weight: 700;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--folder-color);
    }

    /* 區塊 3：按鈕控制區 */
    .section-bottom {
      width: 100%;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .controls {
      width: 100%;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #drawBtn {
      background-color: var(--primary);
      color: white;
      flex: 2;
    }

    #drawBtn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    #resetBtn {
      background-color: var(--card-bg);
      color: var(--danger);
      border: 1px solid var(--border);
      flex: 1;
      line-height: 1.15;
      padding: 6px 10px;
      font-size: 0.85rem;
      position: relative;
      overflow: hidden;
    }

    #resetBtn:hover:not(:disabled) {
      background-color: var(--danger);
      color: white;
    }

    /* 長按時的進度條視覺特效 */
    .hold-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background-color: var(--danger);
      width: 0%;
      transition: width 0.05s linear;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.75rem;
      margin-top: 4px;
      display: none;
    }

    /* ========================================== */
    /* PC 電腦螢幕大畫面自動展開 */
    /* ========================================== */
    @media (min-width: 768px) {
      body {
        padding: 24px;
      }
      .wrapper {
        max-width: 640px;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 20px;
      }
      .status-bar {
        gap: 16px;
      }
      .status-badge {
        font-size: 1rem;
        padding: 6px 16px;
      }
      .image-box {
        height: 360px;
        margin-bottom: 12px;
      }
      .placeholder-text {
        font-size: 1.1rem;
      }
      .result-label {
        min-height: 72px;
        max-height: 72px;
        font-size: 1rem;
      }
      .result-folder {
        font-size: 1.45rem;
      }
      button {
        padding: 14px 24px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- 區塊 1：標題與狀態列 -->
    <div class="section-top">
      <h1>隨機抽籤</h1>
      <div class="status-bar">
        <span class="status-badge">總數：<strong id="totalCount">-</strong></span>
        <span class="status-badge">已抽：<strong id="drawnCount">-</strong></span>
        <span class="status-badge">剩餘：<strong id="remainCount">-</strong></span>
      </div>
    </div>

    <!-- 區塊 2：圖片與結果顯示區 -->
    <div class="section-middle">
      <div class="image-box">
        <div class="placeholder-text" id="placeholder">正在從 GitHub 載入圖片清單...</div>
        <img id="resultImg" alt="抽籤結果">
      </div>
      <div class="result-label" id="resultLabel"></div>
    </div>

    <!-- 區塊 3：按鈕控制區 -->
    <div class="section-bottom">
      <div class="controls">
        <button id="drawBtn" disabled>抽籤</button>
        <button id="resetBtn" disabled>重置
          <div class="hold-progress" id="holdProgress"></div>
        </button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      owner: 'gamania31610',
      repo: 'Dress-Draw',
      targetFolder: 'images/', 
      storageKey: 'dress_draw_history_v1',
      tokenKey: 'github_pat_token_v1',
      allowedExtensions: ['.jpg', '.jpeg', '.png', '.gif', '.webp']
    };

    let allImages = [];      
    let drawnHistory = [];   
    let isDrawing = false;

    const totalCountEl = document.getElementById('totalCount');
    const drawnCountEl = document.getElementById('drawnCount');
    const remainCountEl = document.getElementById('remainCount');
    const placeholderEl = document.getElementById('placeholder');
    const resultImgEl = document.getElementById('resultImg');
    const resultLabelEl = document.getElementById('resultLabel');
    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const holdProgressEl = document.getElementById('holdProgress');
    const errorMsgEl = document.getElementById('errorMsg');

    // 取得 GitHub API 標頭（若有設定 Token 則自動夾帶）
    function getApiHeaders() {
      const token = localStorage.getItem(CONFIG.tokenKey);
      const headers = {};
      if (token && token.trim() !== '') {
        headers['Authorization'] = `Bearer ${token.trim()}`;
      }
      return headers;
    }

    async function init() {
      loadHistory();
      try {
        await fetchRepoImages();
        updateUIState();
        if (allImages.length === 0) {
          placeholderEl.textContent = `在 ${CONFIG.targetFolder} 找不到圖片`;
        } else if (getAvailableImages().length === 0) {
          placeholderEl.textContent = '所有圖片都抽完了！請長按 Reset 重置。';
        } else {
          placeholderEl.textContent = '準備就緒，點擊下方按鈕抽籤';
        }
      } catch (err) {
        showError(`載入失敗：${err.message}`);
        placeholderEl.textContent = '無法載入圖片清單（可能 API 額度已滿，請長按 Reset 設定權杖）';
      }
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(CONFIG.storageKey);
        drawnHistory = saved ? JSON.parse(saved) : [];
      } catch (e) {
        drawnHistory = [];
      }
    }

    function saveHistory() {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(drawnHistory));
    }

    async function fetchRepoImages() {
      const timestamp = Date.now();
      const headers = getApiHeaders();

      const repoRes = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}?t=${timestamp}`, { headers });
      if (!repoRes.ok) {
        if (repoRes.status === 403 || repoRes.status === 429) throw new Error('API 請求次數達上限 (請長按 Reset 設定權杖)');
        if (repoRes.status === 404) throw new Error('找不到 Repo，請確認是否為 Public');
        throw new Error(`HTTP ${repoRes.status}`);
      }
      const repoData = await repoRes.json();
      const defaultBranch = repoData.default_branch;

      const treeRes = await fetch(
        `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${defaultBranch}?recursive=1&t=${timestamp}`,
        { headers }
      );
      if (!treeRes.ok) throw new Error(`無法讀取目錄 (HTTP ${treeRes.status})`);
      const treeData = await treeRes.json();

      allImages = treeData.tree
        .filter(item => {
          if (item.type !== 'blob') return false;
          if (!item.path.startsWith(CONFIG.targetFolder)) return false;
          const lowerPath = item.path.toLowerCase();
          return CONFIG.allowedExtensions.some(ext => lowerPath.endsWith(ext));
        })
        .map(item => item.path);

      const validSet = new Set(allImages);
      drawnHistory = drawnHistory.filter(path => validSet.has(path));
      saveHistory();
    }

    function getAvailableImages() {
      const drawnSet = new Set(drawnHistory);
      return allImages.filter(path => !drawnSet.has(path));
    }

    function updateUIState() {
      const available = getAvailableImages();
      totalCountEl.textContent = allImages.length;
      drawnCountEl.textContent = drawnHistory.length;
      remainCountEl.textContent = available.length;

      drawBtn.disabled = available.length === 0 || isDrawing;
      // 重置按鈕永遠可點擊或長按（即使沒歷史紀錄也能長按設定 Token）
      resetBtn.disabled = isDrawing;
    }

    function handleDraw() {
      const available = getAvailableImages();
      if (available.length === 0 || isDrawing) return;

      isDrawing = true;
      updateUIState();
      errorMsgEl.style.display = 'none';

      const randomIndex = Math.floor(Math.random() * available.length);
      const selectedPath = available[randomIndex];

      const encodedPath = selectedPath.split('/').map(encodeURIComponent).join('/');
      const imageUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/HEAD/${encodedPath}?t=${Date.now()}`;

      const imgLoader = new Image();
      imgLoader.onload = () => {
        drawnHistory.push(selectedPath);
        saveHistory();

        placeholderEl.style.display = 'none';
        resultImgEl.style.display = 'none';
        void resultImgEl.offsetWidth; 
        resultImgEl.src = imageUrl;
        resultImgEl.style.display = 'block';

        const relativePath = selectedPath.replace(CONFIG.targetFolder, '');
        const lastSlashIndex = relativePath.lastIndexOf('/');
        
        let folderName = '根目錄';
        if (lastSlashIndex !== -1) {
          folderName = relativePath.substring(0, lastSlashIndex);
        }

        resultLabelEl.innerHTML = `<span class="result-folder">資料夾：${folderName}</span>`;

        isDrawing = false;
        updateUIState();

        if (getAvailableImages().length === 0) {
          resultLabelEl.innerHTML += '<span style="color: var(--danger); font-size: 0.75rem;"><br>（已全部抽完！）</span>';
        }
      };

      imgLoader.onerror = () => {
        showError(`圖片載入失敗，請重試`);
        isDrawing = false;
        updateUIState();
      };

      imgLoader.src = imageUrl;
    }

    function handleReset() {
      if (drawnHistory.length > 0) {
        if (!confirm('確定要清除抽籤紀錄重新開始嗎？')) return;
      } else {
        alert('目前沒有抽籤紀錄。');
        return;
      }

      drawnHistory = [];
      saveHistory();

      resultImgEl.style.display = 'none';
      resultImgEl.src = '';
      resultLabelEl.innerHTML = '';
      placeholderEl.style.display = 'block';
      placeholderEl.textContent = '紀錄已重置，點擊下方按鈕抽籤';
      errorMsgEl.style.display = 'none';

      updateUIState();
    }

    // ==========================================
    // 長按設定 GitHub Token 邏輯
    // ==========================================
    let holdTimer = null;
    let progressInterval = null;
    const HOLD_DURATION = 1200; // 長按 1.2 秒觸發
    let startTime = 0;

    function startHold(e) {
      if (isDrawing) return;
      startTime = Date.now();
      holdProgressEl.style.width = '0%';

      // 動畫更新進度條
      progressInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const percent = Math.min((elapsed / HOLD_DURATION) * 100, 100);
        holdProgressEl.style.width = percent + '%';
      }, 30);

      // 時間到觸發設定 Token
      holdTimer = setTimeout(() => {
        cancelHold();
        openTokenPrompt();
      }, HOLD_DURATION);
    }

    function cancelHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
      }
      holdProgressEl.style.width = '0%';
    }

    function openTokenPrompt() {
      const currentToken = localStorage.getItem(CONFIG.tokenKey) || '';
      const input = prompt(
        '【GitHub API 權杖設定】\n\n' +
        '輸入 Personal Access Token (PAT) 可將 API 限制從每小時 60 次提升至 5,000 次。\n' +
        '若要清除權杖，請清空輸入框並按確定。',
        currentToken
      );

      if (input !== null) {
        const trimmed = input.trim();
        if (trimmed === '') {
          localStorage.removeItem(CONFIG.tokenKey);
          alert('已清除 GitHub 權杖。');
        } else {
          localStorage.setItem(CONFIG.tokenKey, trimmed);
          alert('GitHub 權杖已成功儲存！');
        }
        init(); // 重新載入
      }
    }

    // 一般短按：執行重置；長按：設定權杖
    resetBtn.addEventListener('click', (e) => {
      // 若剛才經歷了長按觸發，則不執行短按重置
      handleReset();
    });

    // 支援滑鼠與觸控事件
    resetBtn.addEventListener('mousedown', startHold);
    resetBtn.addEventListener('mouseup', cancelHold);
    resetBtn.addEventListener('mouseleave', cancelHold);

    resetBtn.addEventListener('touchstart', (e) => {
      startHold(e);
    }, { passive: true });
    resetBtn.addEventListener('touchend', cancelHold);
    resetBtn.addEventListener('touchcancel', cancelHold);

    drawBtn.addEventListener('click', handleDraw);

    // 支援手機版切換回分頁自動重新整理抓取
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        init();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        init();
      }
    });

    init();
  </script>
</body>
</html>
